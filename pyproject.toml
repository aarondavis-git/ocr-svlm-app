[project]
name = "ocr-svlm-app"
version = "0.1.0"
description = "Local extraction of handwritten form data with OCR engines and vision-language models"
readme = "README.md"
authors = [
    { name = "Aaron-Elihu", email = "65421861+Aaron-Elihu@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "certifi>=2026.7.22",
    "easyocr>=1.7.2",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pdf2image>=1.17.0",
    "pillow>=12.3.0",
    "pytesseract>=0.3.13",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "streamlit>=1.62.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
ocr-svlm = "cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
module-name = ["api", "ingestion", "forms", "review", "cli"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "PLW"]

[tool.mypy]
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = ["easyocr.*", "pytesseract.*"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "mypy>=2.3.1",
    "pandas-stubs>=3.1.0.261029",
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]
